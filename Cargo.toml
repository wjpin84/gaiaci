[workspace]
resolver = "2"

members = [
    "crates/core",
    # Future workspace members can be added here:
    # "crates/registry",
    # "crates/server", 
    # "crates/agent",
    # "crates/cli",
    # "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Justin Preece <wjpin84@gmail.com>"]
license = "MIT"
repository = "https://github.com/wjpin84/gaiaci"
homepage = "https://github.com/wjpin84/gaiaci"
documentation = "https://docs.rs/gaiaci"
keywords = ["ci", "cd", "automation", "lua", "continuous-integration"]
categories = ["development-tools"]

[workspace.dependencies]
# Core dependencies
clap = { version = "4.5", features = ["derive"] }
mlua = { version = "0.10.5", features = ["lua54", "vendored", "serialize", "async"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
chrono = "0.4"
once_cell = "1.18.0"
regex = "1.11.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime  
tokio = { version = "1.0", features = ["full"] }

# HTTP/Web (for future server/registry components)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Database (for future registry/server components)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }

# Utility
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"

# Testing (commonly used as dev-dependencies)
assert_cmd = "2.0"
tempfile = "3.10"
predicates = "3.1"
tokio-test = "0.4"

# Internal workspace crates
gaiaci-core = { path = "crates/core" }

